<svg class="diagram" viewBox="0 0 360 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dg-t dg-d">
  <title id="dg-t">How Braid works</title>
  <desc id="dg-d">Daemons on your devices send sessions over HTTPS to your Braid server. The server stores them in Postgres, signs users in through your OIDC provider and serves the dashboard and the band.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-arrow"/></marker>
  </defs>
  <text x="10" y="20" class="dg-label">Your devices</text>
  <g class="dg-box"><rect x="10" y="30" width="100" height="62" rx="10"/><rect x="130" y="30" width="100" height="62" rx="10"/><rect x="250" y="30" width="100" height="62" rx="10"/></g>
  <g class="dg-text" text-anchor="middle">
    <text x="60" y="56">macOS</text><text x="180" y="56">Linux</text><text x="300" y="56">Windows</text>
    <text x="60" y="76" class="dg-sub">braid daemon</text><text x="180" y="76" class="dg-sub">braid daemon</text><text x="300" y="76" class="dg-sub">braid daemon</text>
  </g>
  <path d="M60 92V118H300V92M180 92V118" class="dg-line"/>
  <path d="M180 118V184" class="dg-line" marker-end="url(#ar)"/>
  <text x="190" y="146" class="dg-sub">HTTPS, device token</text>
  <text x="10" y="176" class="dg-label">Your server</text>
  <rect x="10" y="186" width="340" height="170" rx="12" class="dg-box dg-server"/>
  <g class="dg-text" text-anchor="middle">
    <rect x="30" y="204" width="300" height="56" rx="9" class="dg-box dg-hot"/>
    <text x="180" y="228">braid-server</text><text x="180" y="248" class="dg-sub">ingest, API, live view, dashboard</text>
    <rect x="30" y="290" width="140" height="48" rx="9" class="dg-box"/><text x="100" y="319">Postgres</text>
    <rect x="190" y="290" width="140" height="48" rx="9" class="dg-box"/><text x="260" y="319">Your OIDC login</text>
  </g>
  <path d="M100 260V290M260 260V290" class="dg-line"/>
  <path d="M180 356V396" class="dg-line" marker-end="url(#ar)"/>
  <text x="10" y="390" class="dg-label">You</text>
  <g class="dg-box"><rect x="10" y="402" width="160" height="56" rx="10"/><rect x="190" y="402" width="160" height="56" rx="10"/></g>
  <g class="dg-text" text-anchor="middle"><text x="90" y="436">Web dashboard</text><text x="270" y="436">Band in Claude Code</text></g>
</svg>
