version: "2"
run:
  build-tags: [e2e, webe2e] # lint the chaos and web e2e tests too
linters:
  default: none
  enable:
    - gosec
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - bodyclose
    - noctx
    - errorlint
    - revive
  exclusions:
    rules:
      - path: ^e2e/
        linters: [gosec, noctx]
        text: "G404|G115|must not be called" # test harness: seeded PRNG for reproducible data, loopback sockets, small bounded conversions
