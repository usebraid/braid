name: release
on:
  push:
    branches: [main]
concurrency: release
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  # shortcut: release-please publishes the GitHub release before goreleaser attaches the assets, so "latest" has
  # no checksums for a few minutes (or until a failed run is re-run); upgrade to draft releases if that window matters.
  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Install tools
        run: |
          for t in goreleaser syft cosign; do scripts/install-tool.sh "$t" "$RUNNER_TEMP/bin"; done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  image:
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install tools
        run: |
          for t in trivy cosign; do scripts/install-tool.sh "$t" "$RUNNER_TEMP/bin"; done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push once by digest (no tag), scan exactly that digest, then tag and sign it: the scanned image is the published one.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/usebraid/braid-server,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
            COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan the pushed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for arch in amd64 arm64; do
            trivy image --platform "linux/$arch" --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed=false \
              "ghcr.io/usebraid/braid-server@$DIGEST"
          done
      - name: Tag and sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          docker buildx imagetools create -t "ghcr.io/usebraid/braid-server:$VERSION" -t ghcr.io/usebraid/braid-server:latest \
            "ghcr.io/usebraid/braid-server@$DIGEST"
          cosign sign --yes "ghcr.io/usebraid/braid-server@$DIGEST"
  pages:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
