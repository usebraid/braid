info:
  title: Braid web API
  version: 0.1.0
  description: Cookie-session API used by the Braid web app. State-changing requests must carry an Origin header equal to BRAID_PUBLIC_URL.
servers:
  - url: /
security:
  - session: []
paths:
  /api/v1/me:
    get:
      operationId: getMe
      summary: Current user
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/devices:
    get:
      operationId: listDevices
      summary: Own devices
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Device" } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: renameDevice
      summary: Rename a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeDevice
      summary: Revoke a device and all its tokens
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Own audit entries
      parameters:
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users:
    get:
      operationId: adminListUsers
      summary: All users (admin)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } } }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminDisableUser
      summary: Disable a user; revokes all sessions and tokens
      responses:
        "204": { description: Disabled }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminEnableUser
      summary: Enable a user
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: adminDeleteUser
      summary: Delete a user and all their data
      parameters:
        - name: confirm
          in: query
          required: true
          description: Must equal the user's email exactly.
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/audit:
    get:
      operationId: adminListAudit
      summary: Instance-wide audit log (admin)
      parameters:
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-braid_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Before:
      name: before
      in: query
      description: Return entries with id below this cursor.
      schema: { type: integer, format: int64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Me:
      type: object
      required: [id, email, name, is_admin]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        is_admin: { type: boolean }
    Device:
      type: object
      required: [id, name, hostname, os, arch, os_user, daemon_version, created_at, last_seen_at, last_sync_at, revoked_at, stale]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        os_user: { type: string }
        daemon_version: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        last_sync_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        stale:
          type: boolean
          description: Not revoked and last sync (or creation, if never synced) older than 7 days.
    AuditEntry:
      type: object
      required: [id, at, action, actor_user_id, subject_user_id, device_id, ip, user_agent, detail]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        action: { type: string }
        actor_user_id: { type: [string, "null"], format: uuid }
        subject_user_id: { type: [string, "null"], format: uuid }
        device_id: { type: [string, "null"], format: uuid }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        detail: { type: [object, "null"] }
    AuditPage:
      type: object
      required: [entries, next]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        next:
          type: [integer, "null"]
          format: int64
          description: Cursor for the next page (pass as before), null on the last page.
    AdminUser:
      type: object
      required: [id, email, name, is_admin, disabled_at, last_login_at, last_sync_at, devices, stored_bytes]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        is_admin: { type: boolean }
        disabled_at: { type: [string, "null"], format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
        last_sync_at: { type: [string, "null"], format: date-time }
        devices: { type: integer }
        stored_bytes: { type: integer, format: int64 }
