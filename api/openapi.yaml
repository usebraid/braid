info:
  title: Braid web API
  version: 0.1.0
  description: Cookie-session API used by the Braid web app. State-changing requests must carry an Origin header equal to BRAID_PUBLIC_URL.
servers:
  - url: /
security:
  - session: []
paths:
  /api/v1/about:
    get:
      operationId: getAbout
      summary: Version of the running server and the link to its source
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/About" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/live:
    get:
      operationId: liveSocket
      summary: WebSocket with push events of the current user
      description: |
        WebSocket upgrade (RFC 6455). Requires the session cookie and an Origin header equal to BRAID_PUBLIC_URL.
        Frames are server-to-client JSON text and carry ids only, never data; client frames are ignored
        (at most 256 bytes each, more than 20 per 10 s closes the socket). Frames:
        `{"type":"hello","protocol":1}` right after the upgrade; `{"type":"ping"}` every 25 s;
        `{"type":"session_updated","session_id":"..."}`; `{"type":"device_synced","device_id":"..."}`;
        `{"type":"reindex","state":"started"|"done"}`; `{"type":"resync"}` (events were lost, refetch everything).
        Close codes: 1001 server shutdown, 4401 session no longer valid, 4429 client sent too many frames.
        At most 10 connections per user and 30 connection attempts per minute.
      security:
        - session: []
      responses:
        "101": { description: Switching Protocols }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/me:
    get:
      operationId: getMe
      summary: Current user
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      operationId: patchMe
      summary: Set the user's time zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [time_zone]
              additionalProperties: false
              properties:
                time_zone: { type: string, minLength: 1, maxLength: 64, description: IANA zone name. }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/devices:
    get:
      operationId: listDevices
      summary: Own devices
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Device" } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/devices/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: renameDevice
      summary: Rename a device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeDevice
      summary: Revoke a device and all its tokens
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Own audit entries
      parameters:
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users:
    get:
      operationId: adminListUsers
      summary: All users (admin)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminUser" } } } } }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminDisableUser
      summary: Disable a user; revokes all sessions and tokens
      responses:
        "204": { description: Disabled }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: adminEnableUser
      summary: Enable a user
      responses:
        "204": { description: Enabled }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: adminDeleteUser
      summary: Delete a user and all their data
      parameters:
        - name: confirm
          in: query
          required: true
          description: Must equal the user's email exactly.
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/admin/audit:
    get:
      operationId: adminListAudit
      summary: Instance-wide audit log (admin)
      parameters:
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/stats/live:
    get:
      operationId: statsLive
      summary: Live sessions with their active agents and current tools
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LivePage" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/stats/filters:
    get:
      operationId: statsFilters
      summary: Distinct projects, models and skills of the sessions in range
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FilterOptions" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/stats/overview:
    get:
      operationId: statsOverview
      summary: Overview KPIs, series and heatmap
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/DeviceFilter"
        - $ref: "#/components/parameters/ProjectFilter"
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/SkillFilter"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Overview" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/stats/sessions:
    get:
      operationId: statsSessions
      summary: Sessions in range, newest first
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/DeviceFilter"
        - $ref: "#/components/parameters/ProjectFilter"
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/SkillFilter"
        - $ref: "#/components/parameters/Cursor"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionPage" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/stats/sessions/{id}:
    get:
      operationId: statsSession
      summary: One session with agents, skill phases and failures
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SessionDetail" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/stats/sessions/{id}/lines:
    get:
      operationId: statsSessionLines
      summary: Transcript lines of one agent of a session
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - { name: agent, in: query, description: Agent id., schema: { type: string, default: main } }
        - { name: after, in: query, description: Return lines with id above this line id., schema: { type: integer, format: int64, minimum: 0 } }
        - { name: before, in: query, description: Return the newest lines with id below this line id, ascending. Not combinable with after., schema: { type: integer, format: int64, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LinePage" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/stats/failures:
    get:
      operationId: statsFailures
      summary: Failures with aggregates and time lost
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/DeviceFilter"
        - $ref: "#/components/parameters/ProjectFilter"
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/SkillFilter"
        - $ref: "#/components/parameters/Cursor"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FailurePage" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/stats/search:
    get:
      operationId: statsSearch
      summary: Full-text search over prompts and replies
      parameters:
        - { name: q, in: query, required: true, description: 2 to 200 characters., schema: { type: string, minLength: 2, maxLength: 200 } }
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/DeviceFilter"
        - $ref: "#/components/parameters/ProjectFilter"
        - $ref: "#/components/parameters/ModelFilter"
        - $ref: "#/components/parameters/SkillFilter"
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SearchResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/admin/stats:
    get:
      operationId: adminStats
      summary: Per-user derived statistics and totals (admin)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminStats" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/stats/self:
    get:
      operationId: statsSelf
      summary: Today's figures and one session, for the device (statusline)
      security:
        - device: ["stats:read:self"]
      parameters:
        - { name: Braid-Protocol, in: header, required: true, schema: { type: string } }
        - { name: session, in: query, description: Session id (max 256 characters)., schema: { type: string, maxLength: 256 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Self" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/files:
    get:
      operationId: listFiles
      summary: The files the server holds for the device's user, one cursor page at a time
      security:
        - device: ["ingest:write"]
      parameters:
        - { name: Braid-Protocol, in: header, required: true, schema: { type: string } }
        - { name: after, in: query, description: Cursor from the previous page's next., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/FilesPage" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-braid_session
    device:
      type: http
      scheme: bearer
      description: Device token with scope stats:read:self.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Before:
      name: before
      in: query
      description: Return entries with id below this cursor.
      schema: { type: integer, format: int64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    SessionId:
      name: id
      in: path
      required: true
      description: Free-text session id, not a uuid.
      schema: { type: string, maxLength: 256 }
    From:
      name: from
      in: query
      description: Range start (RFC 3339); default 30 days before To.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: Range end (RFC 3339); default now.
      schema: { type: string, format: date-time }
    DeviceFilter:
      name: device
      in: query
      schema: { type: string, format: uuid }
    ProjectFilter:
      name: project
      in: query
      schema: { type: string, maxLength: 256 }
    ModelFilter:
      name: model
      in: query
      schema: { type: string, maxLength: 256 }
    SkillFilter:
      name: skill
      in: query
      schema: { type: string, maxLength: 256 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's next.
      schema: { type: string }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    About:
      type: object
      required: [version, commit, source_url]
      properties:
        version: { type: string }
        commit: { type: string }
        source_url: { type: string, format: uri, description: Link to exactly this version. }
    Me:
      type: object
      required: [id, email, name, is_admin, time_zone, time_zone_set]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        is_admin: { type: boolean }
        time_zone: { type: string, description: Effective zone (UTC when unset). }
        time_zone_set: { type: boolean }
    Device:
      type: object
      required: [id, name, hostname, os, arch, os_user, daemon_version, created_at, last_seen_at, last_sync_at, revoked_at, stale]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        os_user: { type: string }
        daemon_version: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        last_sync_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        stale:
          type: boolean
          description: Not revoked and last sync (or creation, if never synced) older than 7 days.
    AuditEntry:
      type: object
      required: [id, at, action, actor_user_id, subject_user_id, device_id, ip, user_agent, detail]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        action: { type: string }
        actor_user_id: { type: [string, "null"], format: uuid }
        subject_user_id: { type: [string, "null"], format: uuid }
        device_id: { type: [string, "null"], format: uuid }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        detail: { type: [object, "null"] }
    AuditPage:
      type: object
      required: [entries, next]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        next:
          type: [integer, "null"]
          format: int64
          description: Cursor for the next page (pass as before), null on the last page.
    AdminUser:
      type: object
      required: [id, email, name, is_admin, disabled_at, last_login_at, last_sync_at, devices, stored_bytes]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        is_admin: { type: boolean }
        disabled_at: { type: [string, "null"], format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
        last_sync_at: { type: [string, "null"], format: date-time }
        devices: { type: integer }
        stored_bytes: { type: integer, format: int64 }
    Overview:
      type: object
      required: [from, to, time_zone, reindexing, kpi, per_day, per_model, per_project, heatmap, per_day_by_project]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        time_zone: { type: string }
        reindexing: { type: boolean }
        kpi: { $ref: "#/components/schemas/KPI" }
        per_day: { type: array, items: { $ref: "#/components/schemas/DayPoint" } }
        per_model: { type: array, items: { $ref: "#/components/schemas/ModelPoint" } }
        per_project: { type: array, items: { $ref: "#/components/schemas/ProjectPoint" } }
        heatmap: { type: array, items: { $ref: "#/components/schemas/HeatCell" } }
        per_day_by_project: { $ref: "#/components/schemas/ProjectSplit" }
    ProjectSplit:
      type: object
      description: Daily cost and tokens by project; the top 8 projects by cost plus a trailing "_other" entry when more exist. days[].values[i] belongs to projects[i].
      required: [projects, days]
      properties:
        projects:
          type: array
          items:
            type: object
            required: [key, name]
            properties: { key: { type: string }, name: { type: string } }
        days:
          type: array
          items:
            type: object
            required: [day, values]
            properties:
              day: { type: string, format: date }
              values:
                type: array
                items:
                  type: object
                  required: [cost_usd, tokens]
                  properties: { cost_usd: { type: number }, tokens: { type: integer, format: int64 } }
    KPI:
      type: object
      required: [sessions, agent_ms, total_agent_ms, agent_ms_estimated, cost_usd, cost_unknown_models, tokens, streak_days, failures, time_lost_s]
      properties:
        sessions: { type: integer, format: int64 }
        agent_ms: { type: integer, format: int64 }
        total_agent_ms: { type: integer, format: int64 }
        agent_ms_estimated: { type: boolean }
        cost_usd: { type: number }
        cost_unknown_models: { type: array, items: { type: string } }
        tokens: { type: integer, format: int64 }
        streak_days: { type: integer }
        failures: { type: integer, format: int64 }
        time_lost_s: { type: integer, format: int64 }
    DayPoint:
      type: object
      required: [day, cost_usd, tokens, sessions]
      properties:
        day: { type: string, format: date }
        cost_usd: { type: number }
        tokens: { type: integer, format: int64 }
        sessions: { type: integer, format: int64 }
    ModelPoint:
      type: object
      required: [model, cost_usd, tokens, messages, price_unknown]
      properties:
        model: { type: string }
        cost_usd: { type: number }
        tokens: { type: integer, format: int64 }
        messages: { type: integer, format: int64 }
        price_unknown: { type: boolean }
    ProjectPoint:
      type: object
      required: [path, name, cost_usd, tokens, sessions, agent_ms]
      properties:
        path: { type: string }
        name: { type: string }
        cost_usd: { type: number }
        tokens: { type: integer, format: int64 }
        sessions: { type: integer, format: int64 }
        agent_ms: { type: integer, format: int64 }
    HeatCell:
      type: object
      required: [weekday, hour, count]
      properties:
        weekday: { type: integer }
        hour: { type: integer }
        count: { type: integer, format: int64 }
    SessionItem:
      type: object
      required: [session_id, title, project, project_name, device_id, device_ids, models, started_at, ended_at, is_live, agent_ms, total_agent_ms, agent_ms_estimated, cost_usd, tokens, failures, skills, line_count, git_branch]
      properties:
        session_id: { type: string }
        title: { type: string }
        project: { type: string }
        project_name: { type: string }
        device_id: { type: [string, "null"], format: uuid }
        device_ids: { type: array, items: { type: string, format: uuid } }
        models: { type: array, items: { type: string } }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        is_live: { type: boolean }
        agent_ms: { type: integer, format: int64 }
        total_agent_ms: { type: integer, format: int64 }
        agent_ms_estimated: { type: boolean }
        cost_usd: { type: number }
        tokens: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        skills: { type: array, items: { type: string } }
        line_count: { type: integer, format: int64 }
        git_branch: { type: string }
    CurrentTool:
      type: object
      required: [name, summary, started_at]
      properties:
        name: { type: string }
        summary: { type: string, maxLength: 200 }
        started_at: { type: string, format: date-time }
    LiveAgent:
      type: object
      required: [agent_id, agent_type, description, parent_agent_id, started_at, current_tool]
      properties:
        agent_id: { type: string }
        agent_type: { type: string }
        description: { type: string }
        parent_agent_id: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        current_tool:
          oneOf: [{ $ref: "#/components/schemas/CurrentTool" }, { type: "null" }]
          description: Newest tool call of the agent without end, started less than 15 minutes ago.
    LiveSession:
      type: object
      required: [session, agents]
      properties:
        session: { $ref: "#/components/schemas/SessionItem" }
        agents: { type: array, items: { $ref: "#/components/schemas/LiveAgent" }, description: Agents active within 2 minutes, main first. }
    LivePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LiveSession" } }
    ProjectOption:
      type: object
      required: [path, name]
      properties:
        path: { type: string }
        name: { type: string }
    FilterOptions:
      type: object
      required: [projects, models, skills]
      properties:
        projects: { type: array, items: { $ref: "#/components/schemas/ProjectOption" } }
        models: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
    SessionPage:
      type: object
      required: [items, next]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SessionItem" } }
        next: { type: [string, "null"] }
    AgentUsage:
      type: object
      required: [cost_usd, tokens, input, output, cache_read, cache_write, messages]
      properties:
        cost_usd: { type: number }
        tokens: { type: integer, format: int64 }
        input: { type: integer, format: int64 }
        output: { type: integer, format: int64 }
        cache_read: { type: integer, format: int64 }
        cache_write: { type: integer, format: int64 }
        messages: { type: integer, format: int64 }
    AgentItem:
      type: object
      required: [agent_id, agent_type, description, parent_agent_id, spawn_tool_use_id, spawn_depth, started_at, ended_at, finished, duration_ms, duration_estimated, tool_calls, tool_errors, usage]
      properties:
        agent_id: { type: string }
        agent_type: { type: string }
        description: { type: string }
        parent_agent_id: { type: [string, "null"] }
        spawn_tool_use_id: { type: [string, "null"] }
        spawn_depth: { type: integer }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        finished: { type: [boolean, "null"] }
        duration_ms: { type: integer, format: int64 }
        duration_estimated: { type: boolean }
        tool_calls: { type: object, additionalProperties: { type: integer, format: int64 } }
        tool_errors: { type: integer, format: int64 }
        usage: { $ref: "#/components/schemas/AgentUsage" }
    PhaseItem:
      type: object
      required: [agent_id, seq, skill, started_at, ended_at]
      properties:
        agent_id: { type: string }
        seq: { type: integer }
        skill: { type: string }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
    FailureItem:
      type: object
      required: [category, detail, occurred_at, session_id, agent_id, limit_type, resets_at, time_lost_s, line_id]
      properties:
        category: { type: string }
        detail: { type: string }
        occurred_at: { type: string, format: date-time }
        session_id: { type: string }
        agent_id: { type: string }
        limit_type: { type: [string, "null"] }
        resets_at: { type: [string, "null"], format: date-time }
        time_lost_s: { type: [integer, "null"], format: int64 }
        line_id: { type: integer, format: int64, description: "raw_lines id of the failing line (0 if unavailable)." }
    SessionDetail:
      type: object
      required: [session, agents, skill_phases, failures]
      properties:
        session: { $ref: "#/components/schemas/SessionItem" }
        agents: { type: array, items: { $ref: "#/components/schemas/AgentItem" } }
        skill_phases: { type: array, items: { $ref: "#/components/schemas/PhaseItem" } }
        failures: { type: array, items: { $ref: "#/components/schemas/FailureItem" } }
    LineItem:
      type: object
      required: [id, offset, line]
      properties:
        id: { type: integer, format: int64 }
        offset: { type: integer, format: int64 }
        line: { type: object, description: The raw transcript line. }
    LinePage:
      type: object
      required: [lines, next, prev]
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/LineItem" } }
        next: { type: [string, "null"] }
        prev: { type: [string, "null"], description: Id of the first returned line when an earlier line of the agent exists. }
    FailureAgg:
      type: object
      required: [key, count, time_lost_s]
      properties:
        key: { type: string }
        count: { type: integer, format: int64 }
        time_lost_s: { type: integer, format: int64 }
    FailurePage:
      type: object
      required: [items, next, by_category, by_limit_type, by_day, time_lost_s]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FailureItem" } }
        next: { type: [string, "null"] }
        by_category: { type: array, items: { $ref: "#/components/schemas/FailureAgg" } }
        by_limit_type: { type: array, items: { $ref: "#/components/schemas/FailureAgg" } }
        by_day: { type: array, items: { $ref: "#/components/schemas/FailureAgg" } }
        time_lost_s: { type: integer, format: int64 }
    SearchHit:
      type: object
      required: [session_id, agent_id, role, at, title, snippet, rank, line_id]
      properties:
        session_id: { type: string }
        agent_id: { type: string }
        role: { type: string }
        at: { type: [string, "null"], format: date-time }
        title: { type: string }
        snippet: { type: string }
        rank: { type: number }
        line_id: { type: integer, format: int64, description: "raw_lines id of the hit line (0 if unavailable)." }
    SearchResult:
      type: object
      required: [hits]
      properties:
        hits: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
    SelfToday:
      type: object
      required: [from, to, time_zone, sessions, agent_ms, cost_usd, tokens, failures, time_lost_s]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        time_zone: { type: string }
        sessions: { type: integer, format: int64 }
        agent_ms: { type: integer, format: int64 }
        cost_usd: { type: number }
        tokens: { type: integer, format: int64 }
        failures: { type: integer, format: int64 }
        time_lost_s: { type: integer, format: int64 }
    SelfSession:
      type: object
      required: [session_id, agent_ms, total_agent_ms, cost_usd, tokens, started_at, ended_at, failures]
      properties:
        session_id: { type: string }
        agent_ms: { type: integer, format: int64 }
        total_agent_ms: { type: integer, format: int64 }
        cost_usd: { type: number }
        tokens: { type: integer, format: int64 }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        failures: { type: integer, format: int64 }
    SelfLimit:
      type: object
      required: [type, resets_at]
      properties:
        type: { type: string }
        resets_at: { type: string, format: date-time }
    RemoteFile:
      type: object
      required: [path, head_hash, kind, end_offset]
      properties:
        path: { type: string }
        head_hash: { type: string }
        kind: { type: string, enum: [append, snapshot] }
        end_offset: { type: integer, format: int64 }
        content_hash: { type: string }
        scope: { type: string, enum: [device] }
        tail_offset: { type: integer, format: int64 }
        tail_hash: { type: string }
    FilesPage:
      type: object
      required: [files]
      properties:
        files: { type: array, items: { $ref: "#/components/schemas/RemoteFile" } }
        next: { type: string, description: Cursor of the next page; absent on the last page. }
    Self:
      type: object
      required: [today, session, limit]
      properties:
        today: { $ref: "#/components/schemas/SelfToday" }
        session: { oneOf: [{ $ref: "#/components/schemas/SelfSession" }, { type: "null" }] }
        limit: { oneOf: [{ $ref: "#/components/schemas/SelfLimit" }, { type: "null" }] }
    AdminUserStats:
      type: object
      required: [id, email, name, is_admin, disabled_at, last_login_at, last_sync_at, devices, stored_bytes, sessions, cost_usd, tokens, last_activity_at, derive_errors, rebuilding]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        is_admin: { type: boolean }
        disabled_at: { type: [string, "null"], format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }
        last_sync_at: { type: [string, "null"], format: date-time }
        devices: { type: integer }
        stored_bytes: { type: integer, format: int64 }
        sessions: { type: integer, format: int64 }
        cost_usd: { type: number }
        tokens: { type: integer, format: int64 }
        last_activity_at: { type: [string, "null"], format: date-time }
        derive_errors: { type: integer, format: int64 }
        rebuilding: { type: boolean }
    AdminTotals:
      type: object
      required: [users, devices, sessions, stored_bytes, cost_usd, tokens]
      properties:
        users: { type: integer, format: int64 }
        devices: { type: integer, format: int64 }
        sessions: { type: integer, format: int64 }
        stored_bytes: { type: integer, format: int64 }
        cost_usd: { type: number }
        tokens: { type: integer, format: int64 }
    AdminStats:
      type: object
      required: [users, totals, rebuilding_users]
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/AdminUserStats" } }
        totals: { $ref: "#/components/schemas/AdminTotals" }
        rebuilding_users: { type: integer }
